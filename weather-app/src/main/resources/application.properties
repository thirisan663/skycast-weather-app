# =========================================================
# APPLICATION
# =========================================================
spring.application.name=weather-app
server.port=8080

# =========================================================
# MYSQL DATABASE
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/weather_app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================================================
# THYMELEAF
# =========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# =========================================================
# EXTERNAL WEATHER PROVIDER (e.g. OpenWeatherMap "One Call" style)
# Replace with a real key. Never commit the real key to source control -
# in production, inject this via an environment variable.
# =========================================================
weather.api.base-url=https://api.openweathermap.org/data/2.5
weather.api.geo-url=https://api.openweathermap.org/geo/1.0
weather.api.key=36b6efae45e892d9a0f0a53be9e1efa3
weather.api.units=metric
weather.api.timeout-ms=5000

# =========================================================
# AI ASSISTANT PROVIDER (Anthropic Messages API shape)
# =========================================================
ai.provider.base-url=http://localhost:11434/api/chat
ai.provider.api-key=not-needed
ai.provider.model=llama3.2
ai.provider.max-tokens=500
ai.provider.timeout-ms=90000

# =========================================================
# CACHING (avoid hammering the weather API on repeat searches)
# =========================================================
spring.cache.type=simple
spring.cache.cache-names=currentWeather,forecast

# =========================================================
# LOGGING
# =========================================================
logging.level.com.weatherapp=INFO
logging.level.org.springframework.web=INFO
