<!-- ============================================================
     HEAD FRAGMENT
     Included by every page. Centralises meta tags, Bootstrap,
     Google Fonts, icon font, and our own stylesheets so each page
     template only needs one line: th:replace="~{fragments/head :: head(title)}"
     ============================================================ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title th:text="${title} + ' · SkyCast Weather'">SkyCast Weather</title>
    <meta name="description" content="AI-powered weather dashboard with real-time forecasts and a smart weather assistant.">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- App styles (order matters: variables first, then layout/components) -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/animations.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
</head>
