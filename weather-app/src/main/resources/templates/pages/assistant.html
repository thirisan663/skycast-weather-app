<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

<main class="page-main">
    <div class="container-xl">
        <div class="section-heading animate-fade-up">
            <div>
                <span class="section-eyebrow">Ask away</span>
                <h2><i class="bi bi-stars me-2"></i>AI Weather Assistant</h2>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div th:replace="~{fragments/ai-chat :: aiChat}" style="min-height:560px;"></div>
                <p class="text-muted-custom small mt-3 text-center">
                    <i class="bi bi-info-circle me-1"></i>
                    Search a city on the <a th:href="@{/}">dashboard</a> first so the assistant can ground its answers in real conditions.
                </p>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script th:src="@{/js/ai-assistant.js}"></script>
</body>
</html>
