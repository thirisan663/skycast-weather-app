<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

<main class="page-main">
    <div class="container-xl">

        <section class="mb-4 animate-fade-up">
            <div class="glass-card search-panel">
                <div class="row g-2 align-items-center">
                    <div class="col-12 col-md">
                        <form id="citySearchForm" class="search-input-group" autocomplete="off">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" id="citySearchInput" class="form-control"
                                   placeholder="Search city or country..." aria-label="Search city or country" required>
                            <button type="submit" class="btn btn-search">
                                <i class="bi bi-search"></i><span>Search</span>
                            </button>
                            <div id="searchSuggestions" class="search-suggestions"></div>
                        </form>
                    </div>
                    <div class="col-auto">
                        <button type="button" id="locateMeBtn" class="btn-locate" title="Use my location" aria-label="Use my current location">
                            <i class="bi bi-crosshair"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <div id="dashboardLoading" class="d-none">
            <div class="skeleton" style="height:400px;"></div>
        </div>

        <div id="dashboardEmpty" class="d-none">
            <div th:replace="~{fragments/empty-state :: emptyState('bi-calendar3', 'No forecast yet', 'Search for a city above to see its hourly and 7-day forecast.')}"></div>
        </div>

        <div id="dashboardError" class="d-none mb-4">
            <div class="alert-weather-error">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span id="dashboardErrorText">Something went wrong.</span>
            </div>
        </div>

        <!-- This page reuses the same element IDs as the dashboard hero/stats so
             weather.js drives it identically - only hourly + daily are emphasized. -->
        <div id="dashboardContent" class="d-none animate-fade-up">
            <div id="heroCard" class="hero-weather-card mb-4" data-condition="clear">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
                    <div>
                        <p id="heroLocation" class="hero-location mb-1"><i class="bi bi-geo-alt-fill"></i>&nbsp;--</p>
                        <p id="heroUpdated" class="hero-updated mb-0">Updated --</p>
                    </div>
                    <button id="addFavoriteBtn" class="btn btn-sm btn-light rounded-pill fw-semibold d-none" type="button">
                        <i class="bi bi-star me-1"></i>Add to Favorites
                    </button>
                </div>
                <div class="row align-items-center mt-3">
                    <div class="col-7">
                        <div id="heroTemp" class="hero-temp">--°</div>
                        <div id="heroCondition" class="hero-condition mt-1">--</div>
                        <div id="heroFeelsLike" class="hero-feelslike mt-1">Feels like --°</div>
                    </div>
                    <div class="col-5 text-end">
                        <div class="hero-icon-wrap ms-auto"><i id="heroIcon" class="bi bi-cloud-sun-fill"></i></div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-3 flex-wrap">
                    <span class="hero-minmax"><i class="bi bi-arrow-up"></i> High <strong id="heroMax">--°</strong></span>
                    <span class="hero-minmax"><i class="bi bi-arrow-down"></i> Low <strong id="heroMin">--°</strong></span>
                </div>
            </div>

            <!-- Stat tiles kept in the DOM (hidden visually not needed - just smaller) so weather.js has stable targets -->
            <div class="row g-3 mb-4 d-none d-lg-flex">
                <div class="col-md-4"><div class="stat-tile solid-card"><div class="stat-tile-icon"><i class="bi bi-droplet-half"></i></div><div><div class="stat-tile-label">Humidity</div><div id="statHumidity" class="stat-tile-value">--%</div></div></div></div>
                <div class="col-md-4"><div class="stat-tile solid-card"><div class="stat-tile-icon"><i class="bi bi-wind"></i></div><div><div class="stat-tile-label">Wind</div><div id="statWind" class="stat-tile-value">--</div><div id="statWindSub" class="stat-tile-sub">--</div></div></div></div>
                <div class="col-md-4"><div class="stat-tile solid-card"><div class="stat-tile-icon"><i class="bi bi-speedometer2"></i></div><div><div class="stat-tile-label">Pressure</div><div id="statPressure" class="stat-tile-value">--</div></div></div></div>
                <div class="col-md-4"><div class="stat-tile solid-card"><div class="stat-tile-icon"><i class="bi bi-eye"></i></div><div><div class="stat-tile-label">Visibility</div><div id="statVisibility" class="stat-tile-value">--</div></div></div></div>
                <div class="col-md-4"><div class="stat-tile solid-card"><div class="stat-tile-icon"><i class="bi bi-brightness-high"></i></div><div><div class="stat-tile-label">UV Index</div><div id="statUv" class="stat-tile-value">--</div></div></div></div>
                <div class="col-md-4"><div class="stat-tile solid-card"><div class="stat-tile-icon"><i class="bi bi-sunrise"></i></div><div><div class="stat-tile-label">Sunrise / Sunset</div><div class="stat-tile-value" style="font-size:1rem;"><span id="statSunrise">--</span> / <span id="statSunset">--</span></div></div></div></div>
            </div>

            <div class="mb-4">
                <div class="section-heading"><h5><i class="bi bi-clock me-2"></i>Hourly Forecast</h5></div>
                <div id="hourlyStrip" class="scroll-strip"></div>
            </div>

            <div>
                <div class="section-heading"><h5><i class="bi bi-calendar-week me-2"></i>7-Day Forecast</h5></div>
                <div class="solid-card p-2 p-md-3">
                    <div id="dailyList"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/scripts :: scripts}"></div>
<script th:src="@{/js/weather.js}"></script>
</body>
</html>
